name: Pages

# Publishes the static landing page in `site/` to GitHub Pages.
#
# Screenshots and demo clips are deliberately NOT duplicated into `site/`:
# they live once in `docs/assets/` (already referenced by the README and the
# feature deep dive) and are copied in here at publish time. One copy in git,
# one source of truth.
#
# Requires a one-time setup: Settings → Pages → Source: "GitHub Actions".
# The `configure-pages` step below sets that up automatically on first run.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "scripts/pages-media.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it midway, but never
# queue more than one pending run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage media alongside the page
        run: |
          mkdir -p site/assets
          cp -R docs/assets/. site/assets/

      - name: Fail on references to missing local media
        # Check the staged tree, including video posters and nested sources,
        # before publishing broken media references.
        run: node scripts/pages-media.mjs site

      - uses: actions/configure-pages@v5
        # Enable Pages on first run rather than requiring a manual visit to
        # Settings → Pages. Without this the workflow fails with a bare
        # "Get Pages site failed / Not Found" until someone flips it by hand.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
