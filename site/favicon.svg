<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Workstreams">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa" />
      <stop offset="1" stop-color="#cba6f7" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1e1e2e" />
  <!-- An adaptive tiling layout: one focus tile plus a stack. -->
  <rect x="12" y="12" width="22" height="40" rx="4" fill="url(#g)" />
  <rect x="38" y="12" width="14" height="18" rx="4" fill="#45475a" />
  <rect x="38" y="34" width="14" height="18" rx="4" fill="#45475a" />
</svg>
